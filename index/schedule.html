<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Schedule | J_0137</title>
    <!-- Links to your existing styles and the new schedule styles -->
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/schedule.css">

    <script src="scripts/schedule.js" defer></script>
</head>
<body>

    <!-- Back Button to return to your Linktree -->

    <header class="schedule-header">
        <h1>Stream Schedule</h1>
        <p class="timezone-notice">All times displayed in <strong>EST</strong> (Universal Time -5)</p>

        <div id="live-status-banner" class="status-banner status-loading">
            <span class="status-dot"></span>
            <span id="status-banner-text">Checking channel status...</span>

    </header>

        <p style="color: #666; text-align: center;">Loading stream schedule data...</p>
    </main>


<footer class="site-footer" id="main-footer">
</footer>
