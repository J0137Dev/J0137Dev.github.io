<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lore | J0137Dev</title>
    <!-- Links to your main styles and your specific lore styles -->
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/lore.css">
    <script src="scripts/lore.js" defer></script>
</head>
<body>

    <!-- Back Button -->
    <a href="main.html" class="back-btn">← Back to Links</a>

    <div class="lore-container">
        
        <!-- Profile Avatar Section -->
        <header class="lore-header">
            <div class="avatar-wrapper">
                <img src="source/img/avatar-placeholder.png" alt="J0137Dev Avatar" class="lore-avatar">
            </div>
            <h1 class="lore-title">Lore</h1>
            <p class="lore-subtitle"></p>
        </header>

        <hr class="lore-divider">

        <!-- Detailed lore Content Blocks (Data loads here dynamically) -->
        <main class="lore-content" id="dynamic-lore-box">
            <p class="lore-loading">Loading lore details...</p>
        </main>

    </div>

    <!-- Reusable Shared Footer Container -->
    <footer class="site-footer" id="main-footer"></footer>

</body>
</html>
